name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: .NET build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  clients:
    name: Clients typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    name: Build and push ${{ matrix.image }}
    needs: [backend, clients]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: prepmeup-api
            context: .
            file: src/PrepMeUp.Api/Dockerfile
          - image: prepmeup-keycloak
            context: ./infra/keycloak
            file: infra/keycloak/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/mosekjaer/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/mosekjaer/${{ matrix.image }}:main

  deploy:
    name: Trigger Coolify deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Call deploy webhook
        env:
          WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          status=$(curl --proto '=https' --silent --show-error --output response.txt \
            --write-out '%{http_code}' --request GET "$WEBHOOK" \
            --header "Authorization: Bearer $TOKEN")
          cat response.txt
          test "$status" = 200
